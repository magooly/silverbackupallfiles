apply plugin: 'com.android.application'

import java.util.Properties
import java.io.FileInputStream

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

def releaseStoreFile = keystoreProperties.getProperty("storeFile") ?: System.getenv("RELEASE_STORE_FILE")
def releaseStorePassword = keystoreProperties.getProperty("storePassword") ?: System.getenv("RELEASE_STORE_PASSWORD")
def releaseKeyAlias = keystoreProperties.getProperty("keyAlias") ?: System.getenv("RELEASE_KEY_ALIAS")
def releaseKeyPassword = keystoreProperties.getProperty("keyPassword") ?: System.getenv("RELEASE_KEY_PASSWORD")
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword
def twelveDataApiKey = (localProperties.getProperty("TWELVE_DATA_API_KEY") ?: System.getenv("TWELVE_DATA_API_KEY") ?: "")
    .replace("\\", "\\\\")
    .replace('"', '\\"')
def alphaVantageApiKey = (localProperties.getProperty("ALPHA_VANTAGE_API_KEY")
    ?: System.getenv("ALPHA_VANTAGE_API_KEY")
    ?: localProperties.getProperty("TWELVE_DATA_API_KEY")
    ?: System.getenv("TWELVE_DATA_API_KEY")
    ?: "")
    .replace("\\", "\\\\")
    .replace('"', '\\"')
def eodhdApiKey = (localProperties.getProperty("EODHD_API_KEY")
    ?: System.getenv("EODHD_API_KEY")
    ?: localProperties.getProperty("ALPHA_VANTAGE_API_KEY")
    ?: System.getenv("ALPHA_VANTAGE_API_KEY")
    ?: "")
    .replace("\\", "\\\\")
    .replace('"', '\\"')
def metalChartsApiKey = (localProperties.getProperty("METALCHARTS_API_KEY") ?: System.getenv("METALCHARTS_API_KEY") ?: "")
    .replace("\\", "\\\\")
    .replace('"', '\\"')

android {
    compileSdkVersion 33
    buildFeatures {
        buildConfig true
    }
    lint {
        baseline = file("lint-baseline.xml")
        abortOnError true
    }
    defaultConfig {
        applicationId "com.projects.metalscrypto.holding.release2026"
        minSdkVersion 21
        targetSdkVersion 33
        versionCode 5
        versionName "1.4.0"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField "String", "TWELVE_DATA_API_KEY", "\"${twelveDataApiKey}\""
        buildConfigField "String", "ALPHA_VANTAGE_API_KEY", "\"${alphaVantageApiKey}\""
        buildConfigField "String", "EODHD_API_KEY", "\"${eodhdApiKey}\""
        buildConfigField "String", "METALCHARTS_API_KEY", "\"${metalChartsApiKey}\""
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
    useLibrary 'org.apache.http.legacy'
    namespace 'com.projects.metalscrypto.holding'
}

if (!hasReleaseSigning) {
    println("Release signing is not configured. assembleRelease will produce an unsigned APK.")
}


dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.8.0' // This replaces the old 'com.android.support:design'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.10.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
